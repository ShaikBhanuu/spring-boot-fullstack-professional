# HikariCP (LF-205)
# max-lifetime MUST be shorter than Supabase's idle timeout (~300s)
# keepalive-time sends a ping every 60s so connections stay warm
# pool size 10 is safe for Supabase free tier (max 60 connections)
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=180000
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.connection-test-query=SELECT 1

#  JPA
# Turn off SQL logging on staging - it's noise and slows things down
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

#  Redis (staging may use remote Redis - override host here)
